{% extends "base.html" %}
{% block title %}400 Bad Request — {{ app_name }}{% endblock %}
{% block content %}
<div style="max-width: 500px; margin: 3rem auto; text-align: center;">
  <div class="card">
    <div style="font-size: 3.5rem; margin-bottom: 0.5rem;">⚠️</div>
    <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem;">400 — Bad Request</h1>
    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">
      The request could not be processed due to invalid syntax or expired security tokens.
    </p>
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary">Return Home</a>
  </div>
</div>
{% endblock %}
