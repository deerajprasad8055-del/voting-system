{% extends "base.html" %}
{% block title %}404 Not Found — {{ app_name }}{% endblock %}
{% block content %}
<div style="max-width: 500px; margin: 3rem auto; text-align: center;">
  <div class="card">
    <div style="font-size: 3.5rem; margin-bottom: 0.5rem;">🔍</div>
    <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem;">404 — Page Not Found</h1>
    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">
      The requested page or cryptographic resource could not be found.
    </p>
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary">Return to Portal</a>
  </div>
</div>
{% endblock %}
