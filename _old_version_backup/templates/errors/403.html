{% extends "base.html" %}
{% block title %}403 Access Denied — {{ app_name }}{% endblock %}
{% block content %}
<div style="max-width: 500px; margin: 3rem auto; text-align: center;">
  <div class="card" style="border-color: var(--danger);">
    <div style="font-size: 3.5rem; margin-bottom: 0.5rem;">🛑</div>
    <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem; color: #fca5a5;">403 — Access Forbidden</h1>
    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">
      You do not have the required permissions or cryptographic authorization to view this resource.
    </p>
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary">Return to Portal</a>
  </div>
</div>
{% endblock %}
