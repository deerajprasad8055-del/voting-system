{% extends "base.html" %}
{% block title %}429 Rate Limit Exceeded — {{ app_name }}{% endblock %}
{% block content %}
<div style="max-width: 500px; margin: 3rem auto; text-align: center;">
  <div class="card" style="border-color: var(--warning);">
    <div style="font-size: 3.5rem; margin-bottom: 0.5rem;">⏱️</div>
    <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem; color: #fde047;">429 — Rate Limit Exceeded</h1>
    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">
      You have issued too many requests in a short period. Please wait a few moments before trying again.
    </p>
    <a href="{{ url_for('auth.login') }}" class="btn btn-secondary">Return to Portal</a>
  </div>
</div>
{% endblock %}
